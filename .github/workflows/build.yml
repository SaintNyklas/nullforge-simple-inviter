name: Build Windows Executable

# Builds automatically whenever you push a version tag (e.g. v1.0.0),
# and attaches the resulting .exe to a GitHub Release. This solves needing
# a Windows machine yourself — GitHub's own Windows runners do the build.
#
# To cut a release: 
#   git tag v1.0.0
#   git push origin v1.0.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:  # also allows manually triggering a build from the Actions tab

permissions:
  contents: write  # required so this workflow can create/attach to a GitHub Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write version info file
        shell: bash
        run: |
          cat > version_info.txt << 'EOF'
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=(1, 0, 0, 0),
              prodvers=(1, 0, 0, 0),
              mask=0x3f,
              flags=0x0,
              OS=0x40004,
              fileType=0x1,
              subtype=0x0,
              date=(0, 0)
            ),
            kids=[
              StringFileInfo(
                [
                StringTable(
                  u'040904B0',
                  [StringStruct(u'CompanyName', u'SaintNyklas'),
                  StringStruct(u'FileDescription', u'Nullforge Simple Inviter'),
                  StringStruct(u'FileVersion', u'1.0.0.0'),
                  StringStruct(u'InternalName', u'NullforgeSimpleInviter'),
                  StringStruct(u'LegalCopyright', u'\u00A9 SaintNyklas. Released under the MIT License.'),
                  StringStruct(u'OriginalFilename', u'NullforgeSimpleInviter.exe'),
                  StringStruct(u'ProductName', u'Nullforge Simple Inviter'),
                  StringStruct(u'ProductVersion', u'1.0.0.0')])
                ]),
              VarFileInfo([VarStruct(u'Translation', [1033, 1200])])
            ]
          )
          EOF

      - name: Build executable
        run: >
          pyinstaller --onefile --windowed --name "NullforgeSimpleInviter"
          --icon=assets/nullforge_icon.ico
          --version-file=version_info.txt
          --add-data "ui;ui"
          nullforge_simple_inviter.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NullforgeSimpleInviter-windows
          path: dist/NullforgeSimpleInviter.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NullforgeSimpleInviter.exe
